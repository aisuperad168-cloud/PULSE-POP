name: Newsletter Broadcast Runner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: newsletter-runner
  cancel-in-progress: false

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets presence
        env:
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "=== Secret Presence Check (values masked) ==="
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ NEWSLETTER_CRON_SECRET is EMPTY"
          else
            echo "✓ NEWSLETTER_CRON_SECRET: set (length=${#CRON_SECRET})"
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "❌ CF_ACCESS_CLIENT_ID is EMPTY"
          else
            echo "✓ CF_ACCESS_CLIENT_ID: set (length=${#CF_ACCESS_CLIENT_ID})"
            # 印出前 8 字元讓我們看格式對不對
            echo "  first 8 chars: ${CF_ACCESS_CLIENT_ID:0:8}..."
          fi
          if [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "❌ CF_ACCESS_CLIENT_SECRET is EMPTY"
          else
            echo "✓ CF_ACCESS_CLIENT_SECRET: set (length=${#CF_ACCESS_CLIENT_SECRET})"
          fi

      - name: Trigger broadcast-run API
        env:
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ NEWSLETTER_CRON_SECRET not set"
            exit 1
          fi

          echo "=== Calling API ==="
          # 用臨時檔案分離 headers 和 body 避免混淆
          HTTP_CODE=$(curl -sS -X POST 'https://jdi-pulse.com/api/newsletter/admin-broadcast-run' \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Content-Type: application/json' \
            -o /tmp/response.body \
            -w '%{http_code}' \
            -d '{}')

          echo "HTTP Code: $HTTP_CODE"
          echo "--- Response body ---"
          cat /tmp/response.body
          echo ""
          echo "--- End of body ---"

          if [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "⚠️ 被 Cloudflare Access 擋掉（HTTP $HTTP_CODE）"
            echo "→ 請確認 CF Access policy 有加 Service Auth"
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ HTTP $HTTP_CODE"
            exit 1
          fi

          BODY=$(cat /tmp/response.body)
          if ! echo "$BODY" | jq . > /dev/null 2>&1; then
            echo "❌ Response is not valid JSON"
            exit 1
          fi

          OK=$(echo "$BODY" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            MSG=$(echo "$BODY" | jq -r '.message // ""')
            case "$MSG" in
              *"No pending"*|*"no pending"*|*"not_yet_scheduled"*)
                echo "ℹ️ Nothing to do: $MSG"
                exit 0
                ;;
            esac
            echo "❌ Unexpected error: $BODY"
            exit 1
          fi

          # ok=true 情境: 可能是 broadcast 已執行、或 no pending
          RAN=$(echo "$BODY" | jq -r '.ran // 1')
          MSG=$(echo "$BODY" | jq -r '.message // ""')
          if [ "$RAN" = "0" ]; then
            echo "ℹ️ $MSG"
            exit 0
          fi

          RECIPIENTS=$(echo "$BODY" | jq -r '.recipient_count // 0')
          SUCCESS=$(echo "$BODY" | jq -r '.success_count // 0')
          FAILED=$(echo "$BODY" | jq -r '.fail_count // 0')
          STATUS=$(echo "$BODY" | jq -r '.final_status // "unknown"')
          echo "✅ Broadcast executed: recipients=$RECIPIENTS success=$SUCCESS failed=$FAILED status=$STATUS"

          if [ "$STATUS" = "failed" ] || [ "$STATUS" = "partial" ]; then
            FIRST_ERR=$(echo "$BODY" | jq -r '.first_error // "unknown"')
            echo "⚠️ Broadcast had failures. First error: $FIRST_ERR"
          fi
