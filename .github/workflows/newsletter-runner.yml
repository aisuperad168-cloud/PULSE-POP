name: Newsletter Broadcast Runner

# 每 5 分鐘掃一次，若有 scheduled_at 到期的 broadcast 就執行寄送
# 也支援手動觸發
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 避免並發（一次只跑一個）
concurrency:
  group: newsletter-runner
  cancel-in-progress: false

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger broadcast-run API
        env:
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ NEWSLETTER_CRON_SECRET not set"
            exit 1
          fi

          # 呼叫 admin-broadcast-run（不帶 broadcast_id → 自動找到期 pending）
          RESPONSE=$(curl -sS -X POST 'https://jdi-pulse.com/api/newsletter/admin-broadcast-run' \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "Response: $RESPONSE"

          OK=$(echo "$RESPONSE" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            # 若是 no pending 或已被 admin 手動觸發，非錯誤
            MSG=$(echo "$RESPONSE" | jq -r '.message // ""')
            case "$MSG" in
              *"No pending"*|*"no pending"*|*"not_yet_scheduled"*)
                echo "ℹ️ Nothing to do: $MSG"
                exit 0
                ;;
            esac
            echo "❌ Unexpected error"
            exit 1
          fi

          RECIPIENTS=$(echo "$RESPONSE" | jq -r '.recipient_count // 0')
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success_count // 0')
          FAILED=$(echo "$RESPONSE" | jq -r '.fail_count // 0')
          echo "✅ Broadcast executed: recipients=$RECIPIENTS success=$SUCCESS failed=$FAILED"
