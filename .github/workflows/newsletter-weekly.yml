name: Newsletter Weekly Digest
# 每週一台灣時間 11:00 = UTC 週一 03:00
# 加上手動觸發（workflow_dispatch）
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只掃描不排程（true / false）'
        required: false
        default: 'false'
      delay_minutes:
        description: 'buffer 分鐘數（預設 30）'
        required: false
        default: '30'
      force_include_slugs:
        description: '強制包含這些 slug（逗號分隔，測試用）'
        required: false
        default: ''

jobs:
  scan-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Scan for new articles
        id: scan
        run: |
          set -e
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Scanning articles since $SINCE"

          git log --since="$SINCE" --diff-filter=A --name-only --pretty=format: -- 'live-center/article/*/index.html' \
            | grep -v '^$' | sort -u > /tmp/new_articles.txt || true

          FORCE_SLUGS="${{ inputs.force_include_slugs }}"
          if [ -n "$FORCE_SLUGS" ]; then
            echo "$FORCE_SLUGS" | tr ',' '\n' | while read slug; do
              slug=$(echo "$slug" | xargs)
              if [ -n "$slug" ]; then
                echo "live-center/article/$slug/index.html" >> /tmp/new_articles.txt
              fi
            done
            sort -u /tmp/new_articles.txt -o /tmp/new_articles.txt
          fi

          echo "==== Article files found ===="
          cat /tmp/new_articles.txt || echo "(empty)"
          echo "============================="

          # 建立 Python 解析腳本 (寫到檔案，避免 heredoc + stdin 衝突)
          # BUG history: 之前用 `python3 - < input <<'PYEOF' script PYEOF` 兩個 stdin
          # 導致 script 讀不到 input，所有 article 都被 skip，article_count 永遠 0。
          cat > /tmp/parse_articles.py <<'PYEOF'
          import json, re, sys
          from pathlib import Path

          new_list = [line.strip() for line in sys.stdin if line.strip()]
          print(f"[parse] received {len(new_list)} article paths from stdin", file=sys.stderr)
          articles = []
          for rel in new_list:
              p = Path(rel)
              if not p.exists():
                  print(f"[skip] not found: {rel}", file=sys.stderr)
                  continue

              html = p.read_text(encoding='utf-8')
              slug = p.parent.name

              def extract(pattern, default=''):
                  m = re.search(pattern, html)
                  return m.group(1).strip() if m else default

              title = extract(r'<title>([^<｜|]+)')
              desc = extract(r'<meta name="description" content="([^"]+)"')[:200]
              date = extract(r'<meta property="article:published_time" content="([^"]+)"')
              hero = extract(r'<meta property="og:image" content="[^"]*(/assets/[^"]+)"')

              category = '📚 直播中心'
              m = re.search(r'lc-tag lc-tag--(\w+)', html)
              if m:
                  cat_map = {
                      'creator': '🎨 主播專欄',
                      'policy': '📢 活動政策',
                      'tutorial': '📚 直播教學',
                      'revenue': '💰 收益策略',
                      'glory': '🏆 榮耀時刻',
                      'career':  '💼 產業職涯',
                  }
                  category = cat_map.get(m.group(1), category)

              articles.append({
                  'slug': slug,
                  'title': title,
                  'description': desc,
                  'date': date,
                  'hero': hero,
                  'category': category,
              })
          print(f"[parse] built {len(articles)} article objects", file=sys.stderr)
          print(json.dumps(articles, ensure_ascii=False, indent=2))
          PYEOF

          # 執行 script，stdin 從檔案讀入 (不再有 heredoc 衝突)
          python3 /tmp/parse_articles.py < /tmp/new_articles.txt > /tmp/articles.json

          echo "==== Parsed articles JSON ===="
          cat /tmp/articles.json
          echo "============================="

          ARTICLE_COUNT=$(jq 'length' /tmp/articles.json)
          echo "article_count=$ARTICLE_COUNT"
          echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT
          {
            echo "articles_json<<EOFJSON"
            cat /tmp/articles.json
            echo "EOFJSON"
          } >> $GITHUB_OUTPUT

      - name: Notify no new articles
        if: steps.scan.outputs.article_count == '0'
        run: |
          echo "本週無新文章，跳過寄送。"
          echo "TIP: 用 workflow_dispatch 的 force_include_slugs 欄位可測試指定 slug"

      - name: Call schedule-weekly API
        if: steps.scan.outputs.article_count != '0' && inputs.dry_run != 'true'
        env:
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          DELAY_MIN: ${{ inputs.delay_minutes || '30' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ NEWSLETTER_CRON_SECRET not set"
            exit 1
          fi

          ARTICLES='${{ steps.scan.outputs.articles_json }}'
          PAYLOAD=$(jq -n \
            --argjson articles "$ARTICLES" \
            --arg delay "$DELAY_MIN" \
            '{articles: $articles, delay_minutes: ($delay | tonumber)}')

          echo "==== Payload ===="
          echo "$PAYLOAD" | jq .
          echo "================="

          echo "Calling schedule-weekly API..."
          # 使用 -o 分離 body 到臨時檔，避免 grep 誤解 ---HTTP_CODE 前綴為 CLI option
          HTTP_CODE=$(curl -sS -o /tmp/response.body -w "%{http_code}" \
            -X POST "https://jdi-pulse.com/api/newsletter/schedule-weekly" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -d "$PAYLOAD")

          BODY=$(cat /tmp/response.body)
          echo "HTTP $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ schedule-weekly API failed"
            exit 1
          fi

          # 檢查回應內容
          OK=$(echo "$BODY" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            echo "❌ API returned ok=false"
            exit 1
          fi

          echo "✅ Weekly digest scheduled successfully"
