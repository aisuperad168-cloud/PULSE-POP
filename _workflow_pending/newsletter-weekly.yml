name: Newsletter Weekly Digest

# 每週一台灣時間 11:00 = UTC 週一 03:00
# 加上手動觸發（workflow_dispatch）
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只掃描不排程（true / false）'
        required: false
        default: 'false'
      delay_minutes:
        description: 'buffer 分鐘數（預設 30）'
        required: false
        default: '30'

jobs:
  scan-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30  # 需要 7 天內的 commit history

      - name: Scan for new articles from past 7 days
        id: scan
        run: |
          set -e
          # 找 7 天內新增/修改的 live-center/article/*/index.html
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Scanning articles since $SINCE"

          # 用 git 找 7 天內第一次 commit 的 article
          # 只算「新增」的（Diff filter A）避免修改重推
          NEW_ARTICLES=$(git log --since="$SINCE" --diff-filter=A --name-only --pretty=format: -- 'live-center/article/*/index.html' | grep -v '^$' | sort -u || true)
          echo "Found new article files:"
          echo "$NEW_ARTICLES"

          # 解析每個 article 的 meta 成 JSON
          python3 <<'PYEOF' > /tmp/articles.json
          import json, re, sys, os
          from pathlib import Path

          NEW_LIST = """$NEW_ARTICLES""".strip().split('\n') if """$NEW_ARTICLES""".strip() else []
          if not NEW_LIST:
              print("[]")
              sys.exit(0)

          articles = []
          for rel in NEW_LIST:
              rel = rel.strip()
              if not rel: continue
              p = Path(rel)
              if not p.exists(): continue

              html = p.read_text(encoding='utf-8')
              slug = p.parent.name
              # Extract meta from head
              title = ''
              m = re.search(r'<title>([^<｜]+)', html)
              if m: title = m.group(1).strip()
              desc = ''
              m = re.search(r'<meta name="description" content="([^"]+)"', html)
              if m: desc = m.group(1).strip()
              date = ''
              m = re.search(r'<meta property="article:published_time" content="([^"]+)"', html)
              if m: date = m.group(1).strip()
              hero = ''
              m = re.search(r'<meta property="og:image" content="[^"]*(/assets/[^"]+)"', html)
              if m: hero = m.group(1).strip()
              category = '📚 直播中心'
              m = re.search(r'lc-tag lc-tag--(\w+)', html)
              if m:
                  cat_map = {
                      'creator': '🎨 主播專欄',
                      'policy': '📢 活動政策',
                      'tutorial': '📚 直播教學',
                      'revenue': '💰 收益策略',
                      'glory': '🏆 榮耀時刻',
                  }
                  category = cat_map.get(m.group(1), category)

              articles.append({
                  'slug': slug,
                  'title': title,
                  'description': desc[:200],
                  'date': date,
                  'hero': hero,
                  'category': category,
              })
          print(json.dumps(articles, ensure_ascii=False, indent=2))
          PYEOF

          cat /tmp/articles.json
          ARTICLE_COUNT=$(jq 'length' /tmp/articles.json)
          echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT
          echo "articles_json<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/articles.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify no new articles
        if: steps.scan.outputs.article_count == '0'
        run: |
          echo "本週無新文章，跳過寄送。"

      - name: Call schedule-weekly API
        if: steps.scan.outputs.article_count != '0' && inputs.dry_run != 'true'
        env:
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          DELAY_MIN: ${{ inputs.delay_minutes || '30' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ NEWSLETTER_CRON_SECRET not set in repo secrets"
            exit 1
          fi

          ARTICLES='${{ steps.scan.outputs.articles_json }}'

          PAYLOAD=$(jq -n \
            --argjson articles "$ARTICLES" \
            --arg delay "$DELAY_MIN" \
            '{articles: $articles, delay_minutes: ($delay | tonumber), triggered_by: "github_action"}')

          echo "Calling schedule-weekly API..."
          RESPONSE=$(curl -sS -X POST 'https://jdi-pulse.com/api/newsletter/schedule-weekly' \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          echo "Response: $RESPONSE"

          # Fail workflow if API failed
          OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            SKIPPED=$(echo "$RESPONSE" | jq -r '.skipped // false')
            if [ "$SKIPPED" = "true" ]; then
              echo "⚠️ Skipped (already sent or pending exists) — this is not an error"
              exit 0
            fi
            echo "❌ schedule-weekly API returned non-OK"
            exit 1
          fi

      - name: Dry run summary
        if: inputs.dry_run == 'true'
        run: |
          echo "🔍 Dry run mode: scanned but did not call API"
          echo "Found ${{ steps.scan.outputs.article_count }} new articles"
