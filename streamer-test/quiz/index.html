<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>作答中｜主播適配度測驗 · JDI 脈動傳媒</title>
<meta name="description" content="60 題主播適配度測驗作答頁面，深度分析你的 6 大核心能力。" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0A0A14" />

<!-- Favicon -->
<link rel="icon" href="/assets/favicon-32.png?v=20260820b" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260820b" sizes="180x180" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<!-- CSS -->
<link rel="stylesheet" href="/css/streamer-test.css?v=20260820a" />
</head>
<body class="stmt-page stmt-quiz-page">

<!-- ============ PROGRESS BAR (sticky top) ============ -->
<div class="stmt-progress-wrap" id="stmtProgressWrap">
  <div class="stmt-progress-inner">
    <a href="/streamer-test/" class="stmt-progress-back" aria-label="回到介紹頁">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>

    <div class="stmt-progress-info">
      <div class="stmt-progress-module" id="stmtProgressModule">正在準備...</div>
      <div class="stmt-progress-count">
        <span id="stmtProgressCurrent">0</span>
        <span class="stmt-progress-slash">/</span>
        <span id="stmtProgressTotal">60</span>
      </div>
    </div>

    <div class="stmt-progress-bar">
      <div class="stmt-progress-fill" id="stmtProgressFill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- ============ QUIZ CONTAINER ============ -->
<main class="stmt-quiz-main">
  <div class="stmt-quiz-container" id="stmtQuizContainer">
    <!-- 由 JS 動態生成題目 -->
    <div class="stmt-loading">
      <div class="stmt-spinner"></div>
      <p>載入中...</p>
    </div>
  </div>
</main>

<!-- ============ BOTTOM NAV ============ -->
<div class="stmt-bottom-nav" id="stmtBottomNav" hidden>
  <button class="stmt-btn-nav stmt-btn-nav-prev" id="stmtBtnPrev" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    上一頁
  </button>
  <button class="stmt-btn-nav stmt-btn-nav-next" id="stmtBtnNext" type="button" disabled>
    下一頁
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>
</div>

<!-- ============ LEAD FORM MODAL (答完後顯示) ============ -->
<div class="stmt-modal" id="stmtLeadModal" hidden aria-hidden="true">
  <div class="stmt-modal-backdrop" data-close-modal></div>
  <div class="stmt-modal-panel" role="dialog" aria-labelledby="stmtLeadModalTitle">
    <button class="stmt-modal-close" type="button" data-close-modal aria-label="關閉">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>

    <div class="stmt-modal-header">
      <div class="stmt-modal-eyebrow">最後一步</div>
      <h2 id="stmtLeadModalTitle">📩 留下你的資料，收到完整分析報告</h2>
      <p class="stmt-modal-desc">
        我們會將你的<strong>完整測驗報告</strong>（總分、雷達圖、分型分析、發展路徑、4 週行動清單）寄到你的信箱，並由專業經紀人依你的分型提供 1 對 1 諮詢。
      </p>
    </div>

    <form id="stmtLeadForm" class="stmt-lead-form" novalidate>
      <!-- 姓名 + LINE ID row -->
      <div class="stmt-form-row">
        <div class="stmt-form-field">
          <label for="stmtName">姓名 <span class="stmt-required">*</span></label>
          <input type="text" id="stmtName" name="name" required maxlength="30" placeholder="請輸入你的姓名" autocomplete="name" />
        </div>
        <div class="stmt-form-field">
          <label for="stmtLineId">LINE ID <span class="stmt-required">*</span></label>
          <input type="text" id="stmtLineId" name="lineId" required maxlength="40" placeholder="@your_line_id" />
        </div>
      </div>

      <!-- Email -->
      <div class="stmt-form-field">
        <label for="stmtEmail">Email <span class="stmt-required">*</span></label>
        <input type="email" id="stmtEmail" name="email" required maxlength="80" placeholder="your@email.com" autocomplete="email" />
      </div>

      <!-- 性別 + 年齡 row -->
      <div class="stmt-form-row">
        <div class="stmt-form-field">
          <label for="stmtGender">性別</label>
          <select id="stmtGender" name="gender">
            <option value="">請選擇</option>
            <option value="女">女</option>
            <option value="男">男</option>
            <option value="其他">其他</option>
            <option value="不方便透露">不方便透露</option>
          </select>
        </div>
        <div class="stmt-form-field">
          <label for="stmtAge">年齡</label>
          <select id="stmtAge" name="age">
            <option value="">請選擇</option>
            <option value="18-24">18–24</option>
            <option value="25-29">25–29</option>
            <option value="30-34">30–34</option>
            <option value="35+">35+</option>
          </select>
        </div>
      </div>

      <!-- 所在地區 -->
      <div class="stmt-form-field">
        <label for="stmtRegion">所在地區</label>
        <select id="stmtRegion" name="region">
          <option value="">請選擇</option>
          <option value="北北基">北北基（台北、新北、基隆）</option>
          <option value="桃竹苗">桃竹苗（桃園、新竹、苗栗）</option>
          <option value="中彰投">中彰投（台中、彰化、南投）</option>
          <option value="雲嘉南">雲嘉南（雲林、嘉義、台南）</option>
          <option value="高屏">高屏（高雄、屏東）</option>
          <option value="宜花東">宜花東（宜蘭、花蓮、台東）</option>
          <option value="離島">離島（金門、澎湖、馬祖）</option>
          <option value="海外">海外</option>
        </select>
      </div>

      <!-- 主播經驗 -->
      <div class="stmt-form-field">
        <label>目前是否已在做主播？ <span class="stmt-required">*</span></label>
        <div class="stmt-radio-group">
          <label class="stmt-radio-item">
            <input type="radio" name="experience" value="new" required />
            <span class="stmt-radio-box">
              <span class="stmt-radio-title">新手</span>
              <span class="stmt-radio-desc">從未做過</span>
            </span>
          </label>
          <label class="stmt-radio-item">
            <input type="radio" name="experience" value="experienced" />
            <span class="stmt-radio-box">
              <span class="stmt-radio-title">有經驗</span>
              <span class="stmt-radio-desc">曾經做過</span>
            </span>
          </label>
          <label class="stmt-radio-item">
            <input type="radio" name="experience" value="current" />
            <span class="stmt-radio-box">
              <span class="stmt-radio-title">現役</span>
              <span class="stmt-radio-desc">目前正在做</span>
            </span>
          </label>
        </div>
      </div>

      <!-- 隱私同意 -->
      <label class="stmt-consent">
        <input type="checkbox" id="stmtConsent" name="consent" required />
        <span class="stmt-consent-box"></span>
        <span class="stmt-consent-text">
          我同意 JDI 脈動傳媒依《個資法》使用我提供的資料，寄送測驗結果並提供合作諮詢。
        </span>
      </label>

      <!-- 錯誤訊息 -->
      <div class="stmt-form-error" id="stmtFormError" hidden></div>

      <!-- 送出 -->
      <button type="submit" class="stmt-btn-submit" id="stmtBtnSubmit">
        <span class="stmt-btn-submit-idle">
          🎉 產生我的專屬報告
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
        <span class="stmt-btn-submit-loading" hidden>
          <span class="stmt-spinner-sm"></span>
          正在計算並寄送報告...
        </span>
      </button>

      <p class="stmt-form-notice">
        🔒 我們絕不販售或分享你的資料。取消訂閱請寄信到 <a href="mailto:noreply@jdi-pulse.com">noreply@jdi-pulse.com</a>
      </p>
    </form>
  </div>
</div>

<!-- ============ Scripts ============ -->
<!-- 資料層（60 題 + 6 模組 + 分型規則） -->
<script src="/js/streamer-test-data.js?v=20260820a"></script>
<!-- 計分核心（純函式） -->
<script src="/js/streamer-test-core.js?v=20260820a"></script>
<!-- UI 邏輯 -->
<script src="/js/streamer-test-ui.js?v=20260820a"></script>

</body>
</html>
