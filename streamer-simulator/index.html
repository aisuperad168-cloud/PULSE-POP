    display: inline-block;
    padding: 6px 14px;
    background: rgba(255, 197, 61, 0.12);

    color: var(--sim-cyan);

    gap: 8px;

    width: 32px;
    height: 32px;
    border-radius: 8px;

    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    font-family: 'Inter', sans-serif;

    background: var(--sim-red);
    color: #fff;
  }
  .sim-option-text {
    flex: 1;
    line-height: 1.5;

    text-align: center;

    display: inline-block;

    flex-direction: column;
    gap: 12px;

    color: var(--sim-text-dim);
    padding: 40px 20px;
    font-size: 15px;

  .sim-loading::before {
    content: '';
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(37, 244, 238, 0.3);
    border-top-color: var(--sim-cyan);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;

    .sim-wrap { padding: 24px 14px 60px; }

    .sim-q-text { font-size: 17px; }
    .sim-option { padding: 14px 16px; font-size: 14px; }
    .sim-hero-meta { gap: 20px; }
  }
