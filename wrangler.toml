# ============================================================
# JDI 脈動傳媒 · Cloudflare Worker with Static Assets 配置
# ============================================================
# 部署到現有的 pulse-pop Worker（覆蓋 jdi-pulse.com）:
#   wrangler deploy
#
# Secrets (敏感值不寫在檔案裡):
#   RESEND_API_KEY   — 用 `wrangler secret put RESEND_API_KEY` 設
# ============================================================

name = "pulse-pop"
main = "_worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ============ Static Assets (取代 pages_build_output_dir) ============
# 這個新格式讓 Worker 可以同時服務靜態檔案 + 執行 fetch handler
# 靜態資源會從專案根目錄讀取，不匹配 API 路由的請求都轉給 assets
[assets]
directory = "."
# ASSETS binding：讓 _worker.js 可以呼叫 env.ASSETS.fetch(request)
binding = "ASSETS"
# ⚠️ 曾經用 "single-page-application"，會導致 .txt/.xml/.json 找不到時
# fallback 回傳 index.html body（但 header 是 text/plain），對 AI/Search
# bot 造成資料污染。改用 "none"：真找不到就 404，讓 _worker.js 白名單邏輯
# 可以誠實檢測。HTML 路由（如 /join → /join.html）由下方 html_handling 處理。
not_found_handling = "none"
# HTML 檔案存取時可省略 .html（例如 /join 對應 /join.html）
html_handling = "auto-trailing-slash"
# ⚠️ 關鍵：讓 Worker 先執行（處理 /api/*），只有 Worker 呼叫 env.ASSETS.fetch() 時才走 assets
# 沒這行的話 assets 會先攔截所有請求，/api/* 會被 SPA fallback 到 index.html
run_worker_first = true

# ============ 非機密環境變數（可 commit）============
[vars]
MAIL_FROM = "noreply@jdi-pulse.com"
MAIL_FROM_NAME = "JDI 脈動傳媒"
MAIL_NOTIFY = "pulsepop9@gmail.com"

# ============ D1 Database 綁定 ============
[[d1_databases]]
binding = "DB"
database_name = "jdi-pulse-leads"
database_id = "cdb12dcc-2c47-4585-91cd-be67af6d0210"
